<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swarf — lathe G-code trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#d5d9d4; --surface:#eceee9; --ink:#1d2a31; --muted:#56636a; --line:#b7bdb6;
  --machine:#2c5e88; --amber:#c98a0c; --go:#2f8a45; --go-dark:#1f6531; --stop:#b93a2a;
  --screen:#13232c; --screen-ink:#cfe6ec; --screen-dim:#7d98a2;
  --metal:#c3c9cc; --hatch:#7d8a91; --chuck:#4a535a; --task:#f6efd9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#192126; --surface:#222c32; --ink:#e2e7e4; --muted:#9aa7ab; --line:#36434a;
    --machine:#6fa9d8; --amber:#eeb33c; --go:#3fa35a; --go-dark:#2b7a40; --stop:#e0604d;
    --screen:#0d181e; --screen-ink:#cfe6ec; --screen-dim:#6f8a94;
    --metal:#59646a; --hatch:#8e9ba1; --chuck:#2d353a; --task:#2e2b20;
  }
}
:root[data-theme="dark"]{
  --panel:#192126; --surface:#222c32; --ink:#e2e7e4; --muted:#9aa7ab; --line:#36434a;
  --machine:#6fa9d8; --amber:#eeb33c; --go:#3fa35a; --go-dark:#2b7a40; --stop:#e0604d;
  --screen:#0d181e; --screen-ink:#cfe6ec; --screen-dim:#6f8a94;
  --metal:#59646a; --hatch:#8e9ba1; --chuck:#2d353a; --task:#2e2b20;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--ink);font:400 16px/1.5 Barlow,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--machine);outline-offset:2px}
.app{max-width:1260px;margin:0 auto;padding:14px 14px 80px;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font:700 34px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
.top p{margin:0;color:var(--muted);font-size:15px}
.lessons{overflow-x:auto;margin:0 -14px;padding:0 14px;scrollbar-width:none}
.lessons::-webkit-scrollbar{display:none}
.lessons ol{list-style:none;margin:0;padding:0;display:flex;gap:8px;width:max-content}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 8px;cursor:pointer;white-space:nowrap;font-weight:500}
.chip .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--panel);font:600 13px/1 "JetBrains Mono",monospace}
.chip.done .n{background:var(--go);color:#fff}
.chip[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.lesson h2{font:700 26px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 8px}
.lesson p{margin:0 0 10px;max-width:68ch}
.lesson b{font-weight:600}
.task{background:var(--task);border-left:4px solid var(--amber);padding:9px 12px;border-radius:0 6px 6px 0}
.answer{margin:6px 0 10px}
.answer summary{cursor:pointer;color:var(--machine);font-weight:600}
.answer pre{background:var(--screen);color:var(--screen-ink);font:14px/1.5 "JetBrains Mono",monospace;padding:10px 12px;border-radius:6px;overflow-x:auto;margin:8px 0}
.left,.right{display:grid;gap:14px;align-content:start;min-width:0}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ed-head label{font:700 20px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.ed-head span{color:var(--muted);font-size:14px}
textarea{width:100%;min-height:250px;resize:vertical;background:var(--screen);color:var(--screen-ink);border:2px solid #0a1318;border-radius:6px;padding:10px 12px;font:15px/1.55 "JetBrains Mono",Menlo,Consolas,monospace;caret-color:var(--amber);tab-size:4}
textarea::selection{background:var(--amber);color:#111}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.keys button{min-width:42px;padding:8px 9px;border:1px solid var(--line);border-bottom-width:3px;background:var(--panel);border-radius:6px;font:600 14px/1 "JetBrains Mono",monospace;cursor:pointer}
.keys button:active{border-bottom-width:1px;transform:translateY(2px)}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cycle{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:17px}
.knob{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#6fd38b,var(--go) 55%,var(--go-dark));border:6px solid #2a3135;box-shadow:0 0 0 2px var(--line),0 4px 0 #0f1416;transition:transform .08s,box-shadow .08s}
.cycle:active .knob{transform:translateY(3px);box-shadow:0 0 0 2px var(--line),0 1px 0 #0f1416}
.cycle.hold .knob{background:radial-gradient(circle at 50% 38%,#ffd57a,var(--amber) 55%,#8a5e05)}
.btn{border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.small{padding:6px 11px;font-size:14px}
.btn.ghost{background:transparent}
.btn[aria-pressed="false"]{color:var(--muted)}
.speed{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--surface);padding:8px 11px;font-size:14px;font-weight:500;cursor:pointer;border-right:1px solid var(--line)}
.speed button:last-child{border-right:0}
.speed button[aria-checked="true"]{background:var(--ink);color:var(--surface)}
.viewer{padding:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:11px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.stage{position:relative;height:clamp(300px,78vw,470px)}
.stage canvas{display:block;width:100%;height:100%}
#stage3d{background:radial-gradient(ellipse at 50% 30%,#59656c,#1d2428 75%)}
#stage3d canvas{touch-action:none;cursor:grab}
.legend{position:absolute;left:12px;bottom:8px;display:flex;gap:14px;font-size:13px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--machine);vertical-align:middle;margin-right:5px}
.legend i.r{border-top:3px dashed var(--amber)}
.legend i.t{border-top:2px dashed var(--go)}
.ov{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.ov.tl{left:10px;top:10px}
.ov.br{right:10px;bottom:10px}
.ov .seg{display:flex;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.ov .seg button,.ov .tg{border:0;background:rgba(15,22,26,.62);color:#e6ecee;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(4px)}
.ov .tg{border:1px solid rgba(255,255,255,.25);border-radius:6px}
.ov .seg button[aria-checked="true"],.ov .tg[aria-pressed="true"]{background:#e6ecee;color:#1d2a31}
.alarm{position:absolute;left:10px;right:10px;top:50px;background:rgba(160,30,20,.92);color:#fff;border-radius:6px;padding:10px 12px;font-weight:600;display:none}
.alarm.on{display:block}
.alarm small{display:block;font-weight:400;font-size:14px;margin-top:2px}
.dro{background:var(--screen);color:var(--screen-ink);padding:10px 14px;font-family:"JetBrains Mono",monospace}
.dro .axes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dro .ax{display:flex;flex-direction:column}
.dro .ax span{font-size:12px;color:var(--screen-dim)}
.dro .ax b{font-size:17px;font-weight:600}
.dro .blkrow{display:flex;gap:10px;margin-top:6px;font-size:14px;min-height:21px}
.dro .blk{flex:1;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dro .tm{color:var(--screen-dim)}
.console{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.msg{border-radius:6px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-left-width:5px}
.msg.err{border-left-color:var(--stop)}
.msg.warn{border-left-color:var(--amber)}
.msg.ok{border-left-color:var(--go)}
.msg.info{border-left-color:var(--machine)}
.msg .ln{font:600 13px/1 "JetBrains Mono",monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 6px;margin-right:6px;cursor:pointer}
.msg .btn{margin-top:8px}
.ref summary{cursor:pointer;font:700 20px/1.2 "Barlow Condensed","Arial Narrow",sans-serif}
.ref dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:12px 0 4px}
.ref dt{font:600 14px/1.5 "JetBrains Mono",monospace}
.ref dd{margin:0;font-size:15px}
.ref p{color:var(--muted);font-size:14px;margin:10px 0 0}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,.95fr) minmax(0,1.2fr);padding:22px 22px 36px}
  .top,.lessons{grid-column:1/-1}
  .lessons{margin:0;padding:0}
  .stage{height:470px}
  .right{position:sticky;top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.anno{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:14px}
.anno td{border-top:1px solid var(--line);padding:6px 6px;vertical-align:top}
.anno td:first-child{font:600 13px/1.4 "JetBrains Mono",monospace;white-space:nowrap;color:var(--machine);width:1%}
.iss{margin:6px 0 0;padding-left:18px}
.iss li{margin:3px 0}
.fab{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;padding:12px 18px;background:var(--ink);color:var(--surface);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
dialog#ref{border:0;padding:0;width:100%;max-width:640px;max-height:88vh;margin:auto auto 0;border-radius:14px 14px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog#ref::backdrop{background:rgba(10,15,18,.55)}
@media (min-width:700px){dialog#ref{margin:auto;border-radius:12px}}
.reftabs{display:flex;border-bottom:1px solid var(--line)}
.reftabs button{flex:1;border:0;background:transparent;padding:10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.reftabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
#refbody{max-height:calc(88vh - 108px)}
.codesearch{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;margin:4px 0 10px}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:top}
.ctable td:first-child{font:600 14px/1.4 "JetBrains Mono",monospace;white-space:nowrap;width:1%}
.ctable code{font:13px "JetBrains Mono",monospace;color:var(--machine)}
.tag{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted)}
.refnote{font-size:13px;color:var(--muted);margin:10px 2px}
.calc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--panel)}
.calc h4{margin:0 0 8px;font:700 18px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.calc .in{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.calc label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.calc input{font:15px "JetBrains Mono",monospace;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.calc .out{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px}
.calc .out div{font-size:13px;color:var(--muted)}
.calc .out b{display:block;font:600 17px "JetBrains Mono",monospace;color:var(--ink)}
.calc .ins{margin-top:8px}
.chooser{position:fixed;inset:0;z-index:50;background:var(--panel);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.chooser[hidden]{display:none}
.choose-in{width:100%;max-width:760px;text-align:center}
.choose-in h1{font:700 56px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 6px}
.choose-in>p{color:var(--muted);margin:0 0 22px;font-size:17px}
.choose-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.choose{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 16px 18px;border:1px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);cursor:pointer;text-align:center}
.choose:hover{border-color:var(--ink)}
.choose svg{width:160px;height:94px;margin-bottom:8px;background:#fbfaf5;border-radius:8px;padding:6px}
.choose strong{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.choose span{color:var(--muted);font-size:15px}
.choose em{font-style:normal;font-size:13px;color:var(--go);font-weight:600;min-height:18px}
dialog.sheet{border:0;padding:0;width:100%;max-width:640px;max-height:88vh;margin:auto auto 0;border-radius:14px 14px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog.sheet::backdrop{background:rgba(10,15,18,.55)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:12px}}
.refbody{max-height:calc(88vh - 108px)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.btn[data-armed]{border-color:var(--stop);color:var(--stop)}
.dwg{margin:4px 0 12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fbfaf5}
.dwg svg{display:block;width:100%;height:auto}
.dwg figcaption{font-size:13px;color:#4a5358;padding:4px 10px 6px;border-top:1px solid #e3e1d8}
.setup h3{font:700 20px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
.ring{position:relative;width:min(300px,100%);aspect-ratio:1;margin:6px auto 4px}
.ring .hub{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--surface),var(--panel));border:2px solid var(--line);display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);padding:10px;line-height:1.3}
.stn{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.05}
.stn b{font:600 12px/1 "JetBrains Mono",monospace}
.stn span{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.stn.full{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.stn.full span{color:var(--amber)}
.loaded{list-style:none;margin:8px 0 0;padding:0;font-size:14px;display:grid;gap:2px}
.loaded b{font-family:"JetBrains Mono",monospace;font-weight:600;margin-right:6px}
dialog#lib{border:0;padding:0;width:100%;max-width:560px;max-height:86vh;margin:auto auto 0;border-radius:14px 14px 0 0;background:var(--surface);color:var(--ink);overflow:hidden}
dialog#lib::backdrop{background:rgba(10,15,18,.55)}
@media (min-width:700px){dialog#lib{margin:auto;border-radius:12px}}
.libhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.libhead h3{margin:0;font:700 22px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.liblist{overflow-y:auto;max-height:calc(86vh - 60px);padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px))}
.tool{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;margin:0 0 8px;cursor:pointer}
.tool[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.tool svg{width:52px;height:52px;background:var(--surface);border-radius:6px}
.tool strong{display:block;font-weight:600}
.tool .note{font-size:14px;color:var(--muted);display:block}
.tool .spec{font:12px/1.4 "JetBrains Mono",monospace;color:var(--muted);display:block;margin-top:3px}
.libgroup{font-weight:600;font-size:14px;color:var(--muted);margin:10px 4px 6px}
</style>
</head>
<body data-mode="choose">
<div id="chooser" class="chooser">
  <div class="choose-in">
    <h1>Swarf</h1>
    <p>CNC G-code trainer. What are we making today?</p>
    <div class="choose-cards">
      <button class="choose" data-mode="lathe"><svg viewBox="0 0 120 70" aria-hidden="true"><rect x="4" y="14" width="22" height="42" rx="3" fill="#59636a"/><rect x="26" y="22" width="10" height="26" fill="#8d969c"/><rect x="36" y="27" width="64" height="16" fill="#c3c9cc"/><rect x="60" y="27" width="40" height="16" fill="#dfe3e5"/><polygon points="78,25 86,8 98,8 90,25" fill="#c9a24a"/><line x1="0" y1="35" x2="120" y2="35" stroke="#15191c" stroke-width=".8" stroke-dasharray="6 2 1 2"/></svg><strong>Turning</strong><span>CNC lathe, Fanuc-style</span><em id="cl-prog"></em></button>
      <button class="choose" data-mode="mill"><svg viewBox="0 0 120 70" aria-hidden="true"><rect x="10" y="50" width="100" height="10" fill="#59636a"/><rect x="24" y="30" width="72" height="20" fill="#c3c9cc"/><rect x="42" y="30" width="36" height="8" fill="#9aa2a8"/><rect x="50" y="0" width="20" height="12" fill="#59636a"/><rect x="55" y="12" width="10" height="22" fill="#b4bcc2"/><line x1="55" y1="18" x2="65" y2="14" stroke="#59636a" stroke-width="1.5"/><line x1="55" y1="25" x2="65" y2="21" stroke="#59636a" stroke-width="1.5"/></svg><strong>Milling</strong><span>Vertical machining centre, Fanuc-style</span><em id="cm-prog"></em></button>
    </div>
  </div>
</div>
<div id="latheApp" hidden>
<div class="app">
  <header class="top">
    <h1>Swarf</h1>
    <p>Lathe G-code trainer, Fanuc-style</p>
    <div class="prog"><span id="progtxt"></span><button class="btn small ghost" id="toMill">Switch to milling</button><button class="btn small ghost" id="resetAll">Reset all progress</button></div>
  </header>
  <nav class="lessons" aria-label="Lessons"><ol id="chips"></ol></nav>

  <div class="left">
    <section class="card lesson" id="lesson" aria-live="polite"></section>
    <section class="card setup">
      <div class="ed-head"><h3>Turret setup</h3><button class="btn small ghost" id="clearT">Empty turret</button></div>
      <div class="ring" id="ring"><div class="hub" id="hub">Tap a station to load a tool</div></div>
      <ul class="loaded" id="loaded"></ul>
    </section>
    <section class="card">
      <div class="ed-head"><label for="code">Program</label><span id="lineinfo"></span></div>
      <textarea id="code" spellcheck="false" autocapitalize="characters" autocomplete="off" autocorrect="off"></textarea>
      <div class="keys" id="keys" aria-label="Quick insert"></div>
    </section>
    <div class="controls">
      <button class="cycle" id="cycle"><span class="knob" aria-hidden="true"></span><span class="lbl" id="cyclelbl">Cycle start</span></button>
      <button class="btn" id="reset">Reset</button>
      <button class="btn" id="sound" aria-pressed="true">Sound on</button>
      <div class="speed" role="radiogroup" aria-label="Simulation speed" id="speed"></div>
    </div>
  </div>

  <div class="right">
    <section class="card viewer" id="viewer">
      <div class="tabs" role="tablist">
        <button role="tab" id="t3d" aria-selected="true">Machine</button>
        <button role="tab" id="t2d" aria-selected="false">Section</button>
      </div>
      <div class="stage" id="stage3d">
        <div class="ov tl"><div class="seg" role="radiogroup" aria-label="Camera" id="cams"></div></div>
        <div class="alarm" id="alarm" role="alert"></div>
        <div class="ov br"><button class="tg" id="tgPath" aria-pressed="true">Path</button><button class="tg" id="tgDraw" aria-pressed="false">Drawing</button></div>
      </div>
      <div class="stage" id="stage2d" hidden>
        <canvas id="c2" aria-label="Section view of the bar and toolpath"></canvas>
        <div class="legend"><span><i></i>Cut</span><span><i class="r"></i>Rapid</span><span><i class="t"></i>Drawing</span></div>
      </div>
      <div class="dro">

<script>
(function(){
"use strict";
const L=70, DZ=0.1, NS=Math.round(L/DZ)+1, R0=20, CHUCK_R=36, STEP=0.05, RAPID=250;
const HOME={x:200,z:80};
const DEG=Math.PI/180;

/* ---------- tool library ---------- */
const TOOLS={
  cnmg:{code:'CNMG',name:'CNMG 80° roughing',group:'Turning',kind:'turn',ins:80,appr:95,side:12.9,doc:4,ramp:5,
    note:'Strong 80° insert for heavy roughing and facing. Too blunt to dig down into profiles.'},
  dnmg:{code:'DNMG',name:'DNMG 55° profiling',group:'Turning',kind:'turn',ins:55,appr:93,side:15.5,doc:4,ramp:27,
    note:'All-rounder for profiling and finishing. Ramps down into a profile up to 27°.'},
  vnmg:{code:'VNMG',name:'VNMG 35° fine profiling',group:'Turning',kind:'turn',ins:35,appr:93,side:16.6,doc:2,ramp:50,
    note:'Sharp, pointy and fragile. Gets into necks and undercuts up to 50°, light cuts only.'},
  thread:{code:'THD',name:'Threading 60° external',group:'Turning',kind:'thread',ins:60,appr:60,side:8,
    note:'For screw cutting with G32 or G76 only. It will break if you turn with it.'},
  groove3:{code:'GRV',name:'Grooving 3 mm',group:'Grooving and parting',kind:'groove',w:3,reach:6,
    note:'Cuts on its 3 mm front edge. Programmed point is the left (chuck-side) corner. 6 mm deep max.'},
  part3:{code:'PRT',name:'Parting off 3 mm',group:'Grooving and parting',kind:'groove',w:3,reach:24,part:true,
    note:'Long thin blade that reaches right to the centre to cut the part off. Left corner is the programmed point.'},
  cdrill:{code:'CTR',name:'Centre drill A3.15',group:'Drilling',kind:'drill',d:3.15,flute:6,centre:true,
    note:'Spots the hole so the drill starts on centre. Snaps if you go deeper than 6 mm.'},
  drill10:{code:'Ø10',name:'Drill Ø10 HSS',group:'Drilling',kind:'drill',d:10,flute:60,
    note:'118° point. Spot first, and peck every 3 diameters (30 mm) to clear the chips.'},
  drill16:{code:'Ø16',name:'Drill Ø16 HSS',group:'Drilling',kind:'drill',d:16,flute:70,
    note:'118° point. Big enough to get a boring bar in afterwards.'},
  bore:{code:'BOR',name:'Boring bar, min bore Ø12',group:'Boring',kind:'bore',minD:12,reach:40,doc:1.5,
    note:'Turning tool for the inside of a hole. Needs a Ø12 hole or bigger to fit. 40 mm reach.'}
};
const TOOL_IDS=Object.keys(TOOLS);
const STD=['cnmg','dnmg','vnmg','thread','groove3','part3','cdrill','drill10','drill16','bore',null,null];
const tname=id=>id?TOOLS[id].name:'';
function toolSpec(t){
  if(t.kind==='turn') return `Max depth ${t.doc} mm a side · ramp ${t.ramp}°`;
  if(t.kind==='groove') return `Width ${t.w} mm · reach ${t.reach} mm`;
  if(t.kind==='drill') return `Ø${t.d} · ${t.flute} mm deep max`;
  if(t.kind==='bore') return `Min bore Ø${t.minD} · reach ${t.reach} mm · ${t.doc} mm a side`;
  return 'Threading only';
}
function insertPts(t,scale){ // points in (x=z, y=r), tip at origin
  if(t.kind==='thread'){const h=t.side*.87;return [[0,0],[t.side/2,h],[-t.side/2,h]];}
  const e1=(180-t.appr)*DEG, e2=e1-t.ins*DEG, s=t.side*scale;
  return [[0,0],[s*Math.cos(e2),s*Math.sin(e2)],[s*(Math.cos(e2)+Math.cos(e1)),s*(Math.sin(e2)+Math.sin(e1))],[s*Math.cos(e1),s*Math.sin(e1)]];
}
function toolIcon(id){
  const t=TOOLS[id];let g='';const ink='currentColor';
  if(t.kind==='turn'||t.kind==='thread'){
    const P=insertPts(t,.85).map(([x,y])=>[16+x*1.3,40-y*1.3]);
    g=`<rect x="20" y="6" width="14" height="${Math.max(6,40-Math.max(...P.map(p=>40-p[1]))-4)}" fill="#59636a"/><polygon points="${P.map(p=>p.join(',')).join(' ')}" fill="#c9a24a" stroke="${ink}" stroke-width="1"/>`;
  } else if(t.kind==='groove'){
    const h=t.part?32:16;g=`<rect x="20" y="4" width="16" height="${40-h-4}" fill="#59636a"/><rect x="20" y="${40-h}" width="5" height="${h}" fill="#c9a24a" stroke="${ink}" stroke-width="1"/>`;
  } else if(t.kind==='drill'){
    const r=Math.min(9,t.d*.55+1.5);g=`<polygon points="6,24 ${6+r*.7},${24-r} ${6+r*.7},${24+r}" fill="${t.centre?'#c0c4c8':'#c9a24a'}"/><rect x="${6+r*.7}" y="${24-r}" width="${t.centre?14:30}" height="${2*r}" fill="${t.centre?'#c0c4c8':'#c9a24a'}"/><rect x="${t.centre?20+r*.7:36+r*.7}" y="${24-r-2}" width="8" height="${2*r+4}" fill="#59636a"/>`;
  } else if(t.kind==='bore'){
    g=`<rect x="8" y="22" width="36" height="9" rx="2" fill="#59636a"/><polygon points="6,16 13,22 6,24" fill="#c9a24a" stroke="${ink}" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${g}</svg>`;
}

/* ---------- lessons ---------- */
function safetyCheck(src,sim){
  const L2=src.toUpperCase().split('\n').map(t=>t.replace(/\([^)]*\)/g,' ').replace(/;.*$/,''));
  const has=(re,a,b)=>L2.slice(a,b).some(t=>re.test(t));
  const first=L2.findIndex(t=>/[XZUW]\s*-?[\d.]/.test(t)&&!/G\s*0*28(?!\d)/.test(t)&&!/G\s*0*50(?!\d)/.test(t));
  const end=L2.findIndex(t=>/M\s*0*30(?!\d)/.test(t)), fx=first<0?L2.length:first, ex=end<0?L2.length:end;
  let lastCut=0; for(let i=0;i<L2.length;i++) if(/G\s*0*1(?!\d)|G\s*0*[23](?!\d)/.test(L2[i])) lastCut=i;
  const out=[];
  if(!has(/G\s*0*21(?!\d)/,0,fx)) out.push('No G21 before the first move. Without it the control could still be in inches (G20) from the last job.');
  if(!has(/G\s*0*40(?!\d)/,0,fx)) out.push('No G40 before the first move. If tool nose radius compensation (G41/G42) was left on, every move would be offset.');
  if(!has(/G\s*0*99(?!\d)/,0,fx)) out.push('No G99 before the first move. In G98 (feed per minute) F0.2 means 0.2 mm a minute.');
  if(!has(/G\s*0*28(?!\d)/,0,fx)) out.push('No G28 home move before the tool change. Send the turret home before it indexes.');
  if(!has(/G\s*0*9[67](?!\d)/,0,fx)) out.push('No G97 (or G96) before the spindle starts. Say which speed mode the S word is in.');
  if(!has(/M\s*0*8(?!\d)/,0,fx)) out.push('No M08. Turn the coolant on before cutting.');
  if(!has(/M\s*0*9(?!\d)/,lastCut,ex)) out.push('No M09 at the end. Turn the coolant off.');
  if(!has(/M\s*0*5(?!\d)/,lastCut,ex)) out.push('No M05 at the end. Stop the spindle before the program finishes.');
  if(end<0) out.push('No M30. End the program and rewind with M30.');
  const ux=L2.slice(lastCut,ex).findIndex(t=>/G\s*0*28/.test(t)&&/U/.test(t)), wz=L2.slice(lastCut,ex).findIndex(t=>/G\s*0*28/.test(t)&&/W/.test(t));
  if(ux<0||wz<0) out.push('Send the turret home at the end: G28 U0. then G28 W0.');
  else if(ux>wz) out.push('Home X before Z at the end (G28 U0. first, then G28 W0.), so the tool comes straight out before it travels along Z.');
  else if(ux===wz) out.push('Home X and Z on separate lines at the end: G28 U0. then G28 W0. Moving both at once can drag the tool across a shoulder.');
  return out;
}

const HEAD=(o,n,t='T0101',s='G97 S1200')=>`O${o} (${n})\nG21 G40 G99\n${t}\n${s} M03\nM08\n`;
const FOOT=`G00 X100. Z50.\nM09\nM05\nM30\n`;
const SPIGOT71=`G00 X42. Z2.\nG71 U2. R0.5\nG71 P10 Q20 U0. W0. F0.25\nN10 G00 X16.85\nG01 Z0. F0.15\nX19.85 Z-1.5\nZ-20.\nN20 X42.\nG00 X100. Z50.\n`;
const LESSONS=[
{title:'Safety lines',
 brief:`Every program starts and ends with the same few lines. They put the control into a known state, whatever the last job left switched on, and leave the machine safe when you've finished. Here's what each one does:
 <table class="anno"><tbody>
 <tr><td>O1000 (SAFETY)</td><td>Program number and a name so you can find it.</td></tr>
 <tr><td>G21 G40 G99</td><td>The <b>safety line</b>. G21 millimetres, G40 cancel tool nose radius compensation, G99 feed per rev. These are modal and stay on until changed, so if the last program left G20 (inch), G41 or G98 (feed per minute) active, your F0.2 or X36. would mean something completely different. Some shops add G18 (XZ plane) and G80 too.</td></tr>
 <tr><td>G28 U0. W0.</td><td>Send the turret to machine home before indexing, so the tools can swing round clear of the chuck.</td></tr>
 <tr><td>T0101</td><td>Index to station 01 and pick up offset 01.</td></tr>
 <tr><td>G97 S1200 M03</td><td>Fixed rpm (G97), 1200 rpm, spindle on forward. Always give the speed before or with M03.</td></tr>
 <tr><td>M08</td><td>Coolant on.</td></tr>
 <tr><td>G00 X36. Z2.</td><td>Rapid to just clear of the work. Never rapid straight to the cutting position.</td></tr>
 <tr><td>…</td><td>The cutting.</td></tr>
 <tr><td>G00 X45.</td><td>Pull clear in X first, away from the part.</td></tr>
 <tr><td>G28 U0.</td><td>Home X on its own, so the tool comes straight out…</td></tr>
 <tr><td>G28 W0.</td><td>…then home Z. Doing both at once can drag a tool across a shoulder.</td></tr>
 <tr><td>M09</td><td>Coolant off.</td></tr>
 <tr><td>M05</td><td>Spindle stop.</td></tr>
 <tr><td>M30</td><td>End of program and rewind to the top, ready for the next part.</td></tr>
 </tbody></table>`,
 task:`The cut is written for you. Load the CNMG roughing tool in station 1, then add the start-up lines above the cut and the shut-down lines below it. It only passes when the part is right <b>and</b> every safety step is there.`,
 starter:`O1000 (SAFETY)\n(start-up: safety line, home, tool, spindle, coolant)\n\n\nG00 X36. Z2.\nG01 Z-30. F0.2\nG00 X45.\n(shut-down: home X then Z, coolant off, spindle off, end)\n\n\n`,
 solution:`O1000 (SAFETY)\nG21 G40 G99\nG28 U0. W0.\nT0101\nG97 S1200 M03\nM08\nG00 X36. Z2.\nG01 Z-30. F0.2\nG00 X45.\nG28 U0.\nG28 W0.\nM09\nM05\nM30\n`,
 check:safetyCheck},
{title:'First cut',
 brief:`Nothing cuts until the right tool is in the turret. Tap station 1 in the turret setup and load the <b>CNMG 80°</b> roughing tool. The program picks it up with <b>T0101</b>. <b>G00</b> moves at rapid through air only, and <b>G01</b> cuts a straight line at feed <b>F</b> (mm per rev). <b>X is a diameter</b>, <b>Z0 is the front face</b>, and minus Z goes towards the chuck.`,
 task:`Load the CNMG in station 1, then turn the Ø40 bar to Ø36 for 30 mm by adding one line that feeds to Z-30. at F0.2.`,
 starter:HEAD(1001,'FIRST CUT')+`G00 X36. Z2.\n(add your cutting move here)\nG00 X45.\n`+FOOT,
 solution:HEAD(1001,'FIRST CUT')+`G00 X36. Z2.\nG01 Z-30. F0.2\nG00 X45.\n`+FOOT},
{title:'Step it down',
 brief:`A shoulder is two diameters. Cut the bigger one first, then step down. Moves are <b>modal</b>: once you've said G01, every line after it is G01 until you say otherwise. Back off in X before rapiding along Z, or you'll drive the tool through the part.`,
 task:`With the CNMG in T01, make Ø36 for 40 mm, then Ø30 for 20 mm.`,
 starter:HEAD(1002,'SHOULDER')+`(your moves here)\n\n`+FOOT,
 solution:HEAD(1002,'SHOULDER')+`G00 X36. Z2.\nG01 Z-40. F0.2\nX38.\nG00 Z2.\nX30.\nG01 Z-20.\nX38.\n`+FOOT},
{title:'Chamfer',
 brief:`Put X and Z on the same G01 line and both axes move together. A 2×45° chamfer moves 2 mm in Z while the diameter grows by 4 (2 a side, because X is a diameter).`,
 task:`Ø36 for 30 mm with a 2×45° chamfer on the front edge. Start at X32. Z2., feed onto the face, then chamfer out.`,
 starter:HEAD(1003,'CHAMFER')+`G00 X32. Z2.\n(your moves here)\n\n`+FOOT,
 solution:HEAD(1003,'CHAMFER')+`G00 X32. Z2.\nG01 Z0. F0.2\nX36. Z-2.\nZ-30.\nX42.\n`+FOOT},
{title:'Taper',
 brief:`A taper is just a long chamfer. Start at the small end and feed to the big end in one line.`,
 task:`Taper from Ø34 at the face out to the full Ø40 at Z-40.`,
 starter:HEAD(1004,'TAPER')+`(your moves here)\n\n`+FOOT,
 solution:HEAD(1004,'TAPER')+`G00 X34. Z2.\nG01 Z0. F0.2\nX40. Z-40.\nX42.\n`+FOOT},
{title:'Arcs and a tool change',
 brief:`<b>G02</b> cuts clockwise and <b>G03</b> anticlockwise, looking at the drawing with Z to the right and X up. Give the end point and <b>R</b>. Rough with one tool, finish with another. When the turret indexes, the whole disc swings round, so <b>send it somewhere safe before calling the next tool</b>. And watch the modal trap: the line after a G02 is still G02.`,
 task:`Ø30 for 25 mm, R2 on the front corner, R5 fillet blending out to the Ø40 bar. Rough at Ø32 with the CNMG in T01, then finish with a DNMG 55° in T02.`,
 starter:HEAD(1005,'ARCS')+`(rough pass at X32.)\n\n(go somewhere safe, then call T0202)\n\n(finish pass)\n\n`+FOOT,
 solution:HEAD(1005,'ARCS')+`(ROUGH)\nG00 X32. Z2.\nG01 Z-29. F0.25\nX42.\nG00 X100. Z50.\n(FINISH)\nT0202\nG97 S1500\nG00 X26. Z2.\nG01 Z0. F0.15\nG03 X30. Z-2. R2.\nG01 Z-25.\nG02 X40. Z-30. R5.\nG01 X42.\n`+FOOT},
{title:'Neck',
 brief:`Every turning insert has a limit on how steeply it can dig down towards the chuck before the back of the insert ploughs into the work. A stubby 80° insert can hardly do it at all. Sharper inserts go steeper but can't take big cuts. Check the ramp angles in the tool library.`,
 task:`Ø30 for 45 mm with an R10 neck, 2 mm deep, from Z-20 to Z-32. Rough to Ø30 with T01, then load a finishing tool in T03 that can get into the neck.`,
 starter:HEAD(1006,'NECK')+`(rough to X30. in two passes)\n\n(finish the neck with T0303)\n\n`+FOOT,
 solution:HEAD(1006,'NECK')+`(ROUGH)\nG00 X32. Z2.\nG01 Z-45. F0.25\nX42.\nG00 Z2.\nX30.\nG01 Z-45.\nX42.\nG00 X100. Z50.\n(NECK)\nT0303\nG97 S1500\nG00 X30. Z2.\nG01 Z-20. F0.12\nG02 X30. Z-32. R10.\nG01 X42.\n`+FOOT},
{title:'Groove',
 brief:`A grooving tool cuts on its flat front edge. Most shops program the <b>left (chuck-side) corner</b>, so a groove from Z-20 to Z-23 is cut with the tool at Z-23. Plunge straight in at a gentle feed, around F0.05, then come straight back out.`,
 task:`Turn Ø36 for 30 mm with T01, then cut a 3 mm wide groove down to Ø30, from Z-20 to Z-23, with the grooving tool in T05.`,
 starter:HEAD(1007,'GROOVE')+`G00 X36. Z2.\nG01 Z-30. F0.2\nX42.\nG00 X100. Z50.\n(call the grooving tool and cut the groove)\n\n`+FOOT,
 solution:HEAD(1007,'GROOVE')+`G00 X36. Z2.\nG01 Z-30. F0.2\nX42.\nG00 X100. Z50.\nT0505\nG97 S800\nG00 X38. Z-23.\nG01 X30. F0.05\nG00 X38.\n`+FOOT},
{title:'Drilling',
 brief:`Drills only cut on the centreline, so it's always <b>X0.</b> Spot the hole with a centre drill first or the drill will wander. Then <b>peck</b>: drill a bit, rapid out to clear the chips, rapid back to just short of the bottom, and carry on.`,
 task:`Centre drill 4 mm deep with T07, then drill Ø10 to Z-25 with T08, pecking every 10 mm.`,
 starter:HEAD(1008,'DRILL','T0707','G97 S1500')+`(spot 4 mm deep)\n\n(retract, call T0808, then drill and peck)\n\n`+FOOT,
 solution:HEAD(1008,'DRILL','T0707','G97 S1500')+`G00 X0. Z2.\nG01 Z-4. F0.08\nG00 Z2.\nX100. Z50.\nT0808\nG97 S900\nG00 X0. Z2.\nG01 Z-10. F0.12\nG00 Z2.\nZ-9.5\nG01 Z-20.\nG00 Z2.\nZ-19.5\nG01 Z-25.\nG00 Z2.\n`+FOOT},
{title:'Boring',
 brief:`A boring bar is a turning tool for the inside, and it needs a hole big enough to fit into first. Inside, X is still a diameter, but you move <b>out</b> (bigger X) to cut. At the bottom, back off towards the centre before pulling out, or you'll drag the tip along the bore.`,
 task:`Spot with T07, drill Ø16 to Z-30 with T09, then bore Ø20 for 20 mm deep with the boring bar in T10, in two passes (Ø18, then Ø20).`,
 starter:HEAD(1009,'BORE','T0707','G97 S1500')+`(spot, drill Ø16, then bore with T1010)\n\n`+FOOT,
 solution:HEAD(1009,'BORE','T0707','G97 S1500')+`G00 X0. Z2.\nG01 Z-4. F0.08\nG00 Z2.\nX100. Z50.\nT0909\nG97 S600\nG00 X0. Z2.\nG01 Z-30. F0.15\nG00 Z2.\nX100. Z50.\nT1010\nG97 S1000\nG00 X18. Z2.\nG01 Z-20. F0.1\nX16.\nG00 Z2.\nX20.\nG01 Z-20.\nX16.\nG00 Z2.\n`+FOOT},
{title:'Part off',
 brief:`The parting tool is a long thin blade that goes right through to the centre. Slow the spindle down, feed gently and go just past centre (<b>X-1.</b>) so it drops off cleanly. Like the grooving tool, the programmed point is the left corner.`,
 task:`Turn Ø36 for 35 mm with T01, then part off a 25 mm long piece with the parting tool in T06.`,
 starter:HEAD(1010,'PART OFF')+`(turn Ø36, then part off with T0606)\n\n`+FOOT,
 solution:HEAD(1010,'PART OFF')+`G00 X36. Z2.\nG01 Z-35. F0.2\nX42.\nG00 X100. Z50.\nT0606\nG97 S800\nG00 X42. Z-28.\nG01 X-1. F0.05\nG00 X42.\n`+FOOT},
{title:'G90 box cycle', cycle:true,
 brief:`Canned cycles pack a whole routine into one line. <b>G90</b> is a box: rapid in to X, feed along to Z, feed back out, then rapid back to where it started. It's modal, so each line after it with just a new X takes another pass at the same Z. A G00 or G01 cancels it.`,
 task:`Turn Ø40 to Ø30 for 30 mm with G90 and the CNMG in T01, taking 1.5 mm a side or less per pass. Start the cycle from X42. Z2.`,
 starter:HEAD(1011,'G90')+`G00 X42. Z2.\n(your G90 passes here)\n\n`+FOOT,
 solution:HEAD(1011,'G90')+`G00 X42. Z2.\nG90 X37. Z-30. F0.25\nX34.\nX31.\nX30.\n`+FOOT},
{title:'G71 roughing, G70 finishing', cycle:true,
 brief:`<b>G71</b> roughs a whole profile for you. You write the finished shape once, between two N numbers, and it works out the passes. <b>G70</b> then follows the same profile to finish it, usually with a second tool. Line one: <b>G71 U2. R0.5</b> (2 mm a side per pass, 0.5 mm pull-off). Line two: <b>G71 P10 Q20 U0.4 W0.05 F0.25</b> (profile from N10 to N20, leave 0.4 on the diameter and 0.05 on faces). The profile must only step one way, out towards the chuck.`,
 task:`Make the Arcs part again with cycles. The profile is written for you. Rough it with G71 using T01, then finish it with G70 using the DNMG in T02.`,
 starter:HEAD(1012,'G71 G70')+`G00 X42. Z2.\n(G71 lines go here)\n\nN10 G00 X26.\nG01 Z0. F0.15\nG03 X30. Z-2. R2.\nG01 Z-25.\nG02 X40. Z-30. R5.\nN20 G01 X42.\nG00 X100. Z50.\n(call T0202, go to X42. Z2., then G70 P10 Q20)\n\n`+FOOT,
 solution:HEAD(1012,'G71 G70')+`G00 X42. Z2.\nG71 U2. R0.5\nG71 P10 Q20 U0.4 W0.05 F0.25\nN10 G00 X26.\nG01 Z0. F0.15\nG03 X30. Z-2. R2.\nG01 Z-25.\nG02 X40. Z-30. R5.\nN20 G01 X42.\nG00 X100. Z50.\nT0202\nG97 S1500\nG00 X42. Z2.\nG70 P10 Q20\n`+FOOT},
{title:'G74 peck drilling', cycle:true,
 brief:`On a lathe, <b>G74</b> is the peck drilling cycle. Line one: <b>G74 R1.</b> (back off 1 mm after each peck to break the chip). Line two: <b>G74 Z-30. Q5000 F0.12</b> (drill to Z-30 in 5 mm pecks). Watch the units: <b>Q is in microns with no decimal point</b>, so Q5000 means 5 mm. Start the cycle from X0.`,
 task:`Spot with T07, then drill Ø10 to Z-30 with G74 and T08, 5 mm pecks.`,
 starter:HEAD(1013,'G74','T0707','G97 S1500')+`G00 X0. Z2.\nG01 Z-4. F0.08\nG00 Z2.\nX100. Z50.\n(call T0808, go to X0. Z2., then G74)\n\n`+FOOT,
 solution:HEAD(1013,'G74','T0707','G97 S1500')+`G00 X0. Z2.\nG01 Z-4. F0.08\nG00 Z2.\nX100. Z50.\nT0808\nG97 S900\nG00 X0. Z2.\nG74 R1.\nG74 Z-30. Q5000 F0.12\n`+FOOT},
{title:'G75 wide groove', cycle:true,

  const edges=poly=>{ const m=new Map(); for(let k=1;k<poly.length-1;k++){ const a=poly[k-1],b=poly[k],c=poly[k+1];
      let d=Math.abs(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0])); if(d>Math.PI) d=2*Math.PI-d;
      if(d>15*DEG){ const key=Math.round(b[0]*20)/20; m.set(key,Math.max(m.get(key)||0,b[1])); } } return m; };
  const roAt=z=>{ const k=Math.round((zF-z)/DZ); return k>=0&&k<n?ro[k]:0; };
  const topR=Math.max(...ro), INK='#15191c', TH=0.35, TN=0.17;
  const pl=(pts,sg)=>pts.map((p,k)=>(k?'L':'M')+X(p[0])+' '+Y(sg*p[1])).join(' ');
  let g='';
  // silhouette fill
  g+=`<path d="${pl(tp,1)} L${X(zB)} ${Y(-ro[n-1])} ${pl(tp.slice().reverse(),-1).replace(/^M/,'L')} Z" fill="#fff"/>`;
  if(hasBore){
    g+=`<path d="${pl(tp,1)} L${X(zB)} ${Y(ri[n-1])} ${pl(bp.slice().reverse(),1).replace(/^M/,'L')} Z" fill="url(#hatch)" stroke="${INK}" stroke-width="${TH}" stroke-linejoin="round"/>`;
    g+=`<path d="${pl(bp,-1)}" fill="none" stroke="${INK}" stroke-width="${TN}" stroke-dasharray="1.2 .7"/>`;
    for(const [z,r] of edges(bp)) g+=`<line x1="${X(z)}" y1="0" x2="${X(z)}" y2="${Y(-r)}" stroke="${INK}" stroke-width="${TN}" stroke-dasharray="1.2 .7"/>`;
    if(ri[0]>0.05) g+=`<line x1="${X(zF)}" y1="${Y(ri[0])}" x2="${X(zF)}" y2="${Y(ro[0])}" stroke="${INK}" stroke-width="${TH}"/>`;
  }
  // outline
  g+=`<path d="${pl(tp,1)}" fill="none" stroke="${INK}" stroke-width="${TH}" stroke-linejoin="round"/>`;
  g+=`<path d="${pl(tp,-1)}" fill="none" stroke="${INK}" stroke-width="${TH}" stroke-linejoin="round"/>`;
  g+=`<line x1="${X(zF)}" y1="${Y(hasBore?0:ro[0])}" x2="${X(zF)}" y2="${Y(-ro[0])}" stroke="${INK}" stroke-width="${TH}"/>`;
  for(const [z,r] of edges(tp)) g+=`<line x1="${X(z)}" y1="${hasBore?0:Y(r)}" x2="${X(z)}" y2="${Y(-r)}" stroke="${INK}" stroke-width="${TN*1.3}"/>`;
  if(piece) g+=`<line x1="${X(zB)}" y1="${Y(hasBore?ri[n-1]:ro[n-1])}" x2="${X(zB)}" y2="${Y(-ro[n-1])}" stroke="${INK}" stroke-width="${TH}"/>`+(hasBore?`<line x1="${X(zB)}" y1="${Y(ro[n-1])}" x2="${X(zB)}" y2="${Y(ri[n-1])}" stroke="${INK}" stroke-width="${TH}"/>`:'');
  else { const r=ro[n-1]; let d=`M${X(zB)} ${Y(r+1.5)}`; const steps=8; for(let k=1;k<=steps;k++){ const yy=r+1.5-(2*r+3)*k/steps; d+=` L${X(zB+(k%2?1.2:-1.2))} ${Y(yy+(2*r+3)/steps/2)} L${X(zB)} ${Y(yy)}`; } g+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${TN}"/>`; }
  if(dw.thread&&!hasBore){ const t=dw.thread, rm=t.minor/2; let za=null,zb=null; for(let k=0;k<n;k++){ const z=Z(k); if(z<=t.z1&&z>=t.z2&&ro[k]>=rm){ if(za==null) za=z; zb=z; } }
    if(za!=null) for(const sg of [1,-1]) g+=`<line x1="${X(za)}" y1="${Y(sg*rm)}" x2="${X(zb)}" y2="${Y(sg*rm)}" stroke="${INK}" stroke-width="${TN}"/>`; }
  // centre line
  g+=`<line x1="${X(zF+4)}" y1="0" x2="${X(zB-4)}" y2="0" stroke="${INK}" stroke-width="${TN}" stroke-dasharray="6 1.2 1 1.2"/>`;
  // dimensions
  const ah=(x,y,dx,dy)=>{ const L2=Math.hypot(dx,dy)||1, ux=dx/L2, uy=dy/L2, px=-uy, py=ux; return `<path d="M${f(x)} ${f(y)} L${f(x-ux*1.6+px*.45)} ${f(y-uy*1.6+py*.45)} L${f(x-ux*1.6-px*.45)} ${f(y-uy*1.6-py*.45)} Z" fill="${INK}"/>`; };
  const T=(x,y,txt,anc='middle',rot=0)=>`<text x="${f(x)}" y="${f(y)}" font-size="2.6" text-anchor="${anc}" fill="${INK}"${rot?` transform="rotate(${rot} ${f(x)} ${f(y)})"`:''}>${txt}</text>`;
  let ymin=-(topR+4), ymax=topR+4, xmin=zB-5, xmax=zF+6, maxL=-1;
  for(const d of dw.dims){
    if(d.t==='L'){ maxL=Math.max(maxL,d.lvl); const yy=-(topR+4+d.lvl*6), a=Math.max(d.z1,d.z2), b=Math.min(d.z1,d.z2);
      for(const z of [a,b]) g+=`<line x1="${X(z)}" y1="${Y(roAt(z)+0.8)}" x2="${X(z)}" y2="${f(yy-1.2)}" stroke="${INK}" stroke-width="${TN}"/>`;
      g+=`<line x1="${X(b)}" y1="${f(yy)}" x2="${X(a)}" y2="${f(yy)}" stroke="${INK}" stroke-width="${TN}"/>`+ah(a,yy,1,0)+ah(b,yy,-1,0);
      g+=T((a+b)/2,yy-0.8,d.lab||f(a-b)); ymin=Math.min(ymin,yy-4);
    } else if(d.t==='D'){ const r=d.d/2;
      g+=`<line x1="${X(d.z)}" y1="${Y(r)}" x2="${X(d.z)}" y2="${Y(-r)}" stroke="${INK}" stroke-width="${TN}"/>`+ah(d.z,Y(r),0,-1)+ah(d.z,Y(-r),0,1);
      g+=T(d.z-0.8,Y(r/2),d.lab||('Ø'+f(d.d)),'middle',-90);
    } else if(d.t==='N'){ const px=d.z, py=Y(d.r), qx=d.az, qy=Y(d.ar), right=qx>=px, sx=qx+(right?2:-2);
      g+=`<path d="M${f(px)} ${f(py)} L${f(qx)} ${f(qy)} L${f(sx)} ${f(qy)}" fill="none" stroke="${INK}" stroke-width="${TN}"/>`+ah(px,py,px-qx,py-qy);
      g+=T(sx+(right?0.6:-0.6),qy+0.9,d.text,right?'start':'end');
      const w=d.text.length*1.45; if(right) xmax=Math.max(xmax,sx+w+2); else xmin=Math.min(xmin,sx-w-2); ymax=Math.max(ymax,qy+3);
    }
  }
  ymax+=2; xmin=Math.min(xmin,zB-5);
  if(xmax-xmin<75){ const pad=(75-(xmax-xmin))/2; xmin-=pad; xmax+=pad; }
  const W=f(xmax-xmin), H=f(ymax-ymin);
  return `<svg viewBox="${f(xmin)} ${f(ymin)} ${W} ${H}" role="img" aria-label="Drawing for ${l.title}" style="font-family:Barlow,'Segoe UI',sans-serif"><defs><pattern id="hatch" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.6" stroke="${INK}" stroke-width="0.12"/></pattern></defs><rect x="${f(xmin)}" y="${f(ymin)}" width="${W}" height="${H}" fill="#fbfaf5"/>${g}</svg>`;
}

function curPt(){return play.sim?play.sim.pts[play.idx]:{x:HOME.x,z:HOME.z,r:HOME.x/2,f:null,rpm:0,spin:false,cool:false,line:0,rapid:true,tool:null};}

  Object.assign(play,{running:false,paused:false,done:false,sim:null,idx:0,t:0,dirty:true},blank());
  $('alarm').classList.remove('on');
  setCycleLabel();draw2D();updateDRO();

  play.sim=simulate(ed.value,S.turret);play.running=true;
  setCycleLabel();
  if(tab!=='3d') showTab('3d');

function applyPt(p){
  if(p.ch){const c=p.ch;for(let k=0;k<c.length;k+=3){play.rout[c[k]]=c[k+1];play.rin[c[k]]=c[k+2];}play.dirty=true;}
  if(p.part&&T3&&SPEEDS[speedIx][1]!==Infinity) spawnPiece(p.part);
}
const matOf=(o,n)=>o>n+1e-3;
function diaText(o,n){ if(!matOf(o,n)) return 'nothing (parted off or cut away)'; return `Ø${(2*o).toFixed(2)}`+(n>0.01?` with a Ø${(2*n).toFixed(2)} hole`:''); }
function finish(){
  play.running=false;play.done=true;setCycleLabel();
  const sim=play.sim;
  if(sim.error){
    msg('err',esc(sim.error.msg),sim.error.line);sim.warnings.forEach(w=>msg('warn',esc(w.msg),w.line));
    $('alarm').innerHTML=`${sim.error.crash?'Alarm: crash':'Alarm: program stopped'}<small>Line ${sim.error.line}. ${esc(sim.error.msg)}</small>`;$('alarm').classList.add('on');
    if(T3&&sim.error.crash){T3.shake=1;T3.forceStop=true;}
    if(sim.error.crash) beep();
    draw2D();return;
  }
  play.rout=sim.rout;play.rin=sim.rin;play.dirty=true;draw2D();
  const tgt=TARGETS[cur];
  if(tgt){
    let worst=0,wi=0;
    for(let i=0;i<NS;i++){
      const um=matOf(sim.rout[i],sim.rin[i]), tm=matOf(tgt.rout[i],tgt.rin[i]);
      const d=(um!==tm)?99:(um?Math.max(Math.abs(sim.rout[i]-tgt.rout[i]),Math.abs(sim.rin[i]-tgt.rin[i])):0);
      if(d>worst){worst=d;wi=i;}
    }
    const issues=(worst<=0.06&&LESSONS[cur].check)?LESSONS[cur].check(ed.value,sim):[];
    if(worst<=0.06&&issues.length){
      msg('info',`<strong>The part's right, but the program isn't safe yet.</strong><ul class="iss">${issues.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`);
    } else if(worst<=0.06){
      if(!S.done.includes(cur)){S.done.push(cur);save();renderChips();}
      const li=msg('ok',`<strong>To drawing.</strong> Every diameter is within 0.1 mm. Cycle time ${fmtT(sim.total)}.`);
      if(cur<LESSONS.length-1){const b=document.createElement('button');b.className='btn small';b.textContent=`Next: ${LESSONS[cur+1].title}`;b.onclick=()=>{selectLesson(cur+1);window.scrollTo({top:0,behavior:'smooth'});};li.appendChild(document.createElement('br'));li.appendChild(b);}
    } else {
      msg('info',`Not to drawing yet. At Z${(-wi*DZ).toFixed(1)} you have ${diaText(sim.rout[wi],sim.rin[wi])}, and the drawing wants ${diaText(tgt.rout[wi],tgt.rin[wi])}. Turn on Drawing to compare.`);
    }
  } else msg('ok',`Program finished. Cycle time ${fmtT(sim.total)}.`);
  sim.warnings.forEach(w=>msg('warn',esc(w.msg),w.line));
}

  $('dF').textContent=p.f!=null?p.f.toFixed(2):'—';$('dS').textContent=Math.round(p.rpm||0);
  $('dB').textContent=(p.tool!=null?tnum(p.tool)+'  ':'')+(p.line&&play.sim?`N${p.line}  ${play.sim.lines[p.line-1].trim()}`:'');
  $('dT').textContent='Cycle '+fmtT(play.sim?Math.min(play.t,play.sim.total):0);
}

const c2=$('c2');

let hatch=null,hatchKey='';
function draw2D(){
  if(typeof tab==='undefined'||tab!=='2d') return;

function msafetyCheck(src,sim){
  const L2=src.toUpperCase().split('\n').map(t=>t.replace(/\([^)]*\)/g,' ').replace(/;.*$/,''));
  const has=(re,a,b)=>L2.slice(a,b).some(t=>re.test(t));
  const first=L2.findIndex(t=>/[XY]\s*-?[\d.]/.test(t)&&!/G\s*0*28(?!\d)/.test(t));
  const end=L2.findIndex(t=>/M\s*0*30(?!\d)/.test(t)), fx=first<0?L2.length:first, ex=end<0?L2.length:end;
  let lastCut=0; for(let i=0;i<L2.length;i++) if(/G\s*0*[123](?!\d)/.test(L2[i])) lastCut=i;
  const g=n=>new RegExp(`G\\s*0*${n}(?!\\d)`), out=[];
  [['17','No G17. Select the XY plane so arcs go the way you expect.'],['21','No G21. Without it the control could still be in inches from the last job.'],
   ['40','No G40. If cutter compensation was left on, every move would be offset.'],['49','No G49. Cancel any old tool length offset before you start.'],
   ['80','No G80. A drilling cycle left active would drill a hole at your first move.'],['90','No G90. In G91 (incremental) every coordinate means "move this far", not "go here".'],
   ['94','No G94. Say the feed is in mm per minute.']].forEach(([c,m])=>{ if(!has(g(c),0,fx)) out.push(m+' Put it in the safety line.'); });
  const m6=L2.findIndex(t=>/M\s*0*6(?!\d)/.test(t));
  if(m6<0) out.push('No M06 tool change. Call the tool with T3 M06.');
  else if(!L2.slice(0,m6).some(t=>g(28).test(t)&&/Z/.test(t))) out.push('Send Z home before the tool change: G91 G28 Z0. then G90.');
  if(!has(/G\s*0*5[4-9](?!\d)/,0,fx+1)) out.push('No work offset. Call G54 so the control knows where the part is.');
  const g43=L2.findIndex(t=>g(43).test(t));
  if(g43<0) out.push('No G43 H tool length offset. Without it the control positions the spindle, not the tool tip.');
  else { const h=(L2[g43].match(/H\s*(\d+)/)||[])[1], tt=(L2.slice(0,g43).join(' ').match(/T\s*(\d+)/g)||[]).pop();
    if(h&&tt&&+h!==+tt.replace(/\D/g,'')) out.push(`G43 H${h} doesn't match the tool (${tt}). The H number should be the tool number.`); }
  if(!has(/M\s*0*8(?!\d)/,0,fx+4)) out.push('No M08. Turn the coolant on before cutting.');
  if(!has(/M\s*0*9(?!\d)/,lastCut,ex)) out.push('No M09 at the end. Turn the coolant off.');
  if(!has(/M\s*0*5(?!\d)/,lastCut,ex)) out.push('No M05 at the end. Stop the spindle.');
  if(!L2.slice(lastCut,ex).some(t=>g(28).test(t)&&/Z/.test(t))) out.push('Send Z home at the end, G91 G28 Z0., before anything else moves.');
  if(end<0) out.push('No M30. End the program and rewind with M30.');
  return out;
}

function marcCenter(sx,sy,ex,ey,cw,arc){
  if('R' in arc){
    const R=arc.R, d=Math.hypot(ex-sx,ey-sy);
    if(d<1e-6) return {err:'An R arc needs an end point different from the start. Use I and J for a full circle.'};
    if(Math.abs(R)<d/2-1e-4) return {err:`R${Math.abs(R)} is too small. The end point is ${d.toFixed(2)} mm away, so R must be at least ${(d/2).toFixed(2)}.`};
    const h=Math.sqrt(Math.max(0,R*R-d*d/4)), mx=(sx+ex)/2, my=(sy+ey)/2, lx=-(ey-sy)/d, ly=(ex-sx)/d;
    let sg=cw?-1:1; if(R<0) sg=-sg; return {cx:mx+sg*h*lx, cy:my+sg*h*ly, rad:Math.abs(R)};
  }
  if('I' in arc||'J' in arc){ const cx=sx+(arc.I||0), cy=sy+(arc.J||0), rad=Math.hypot(sx-cx,sy-cy);
    if(Math.abs(Math.hypot(ex-cx,ey-cy)-rad)>0.02) return {err:"The end point isn't on the arc. I and J are measured from the start point to the centre."};
    return {cx,cy,rad}; }
  return {err:`G0${cw?2:3} needs either R (radius) or I and J (centre).`};
}

  const tool=()=>st.tool!=null?MTOOLS[mag[st.tool]]:null;

      for(const x of [d.a,d.b]) g+=`<line x1="${x}" y1="${-SY-1}" x2="${x}" y2="${f(yy-1.2)}" stroke="${INK}" stroke-width="${TN}"/>`;
      g+=`<line x1="${d.a}" y1="${f(yy)}" x2="${d.b}" y2="${f(yy)}" stroke="${INK}" stroke-width="${TN}"/>`+ah(d.b,yy,1,0)+ah(d.a,yy,-1,0)+T((d.a+d.b)/2,yy-0.9,d.lab||f(d.b-d.a));
    } else if(d.t==='Y'){ ly=Math.max(ly,d.l); const xx=SX+6+d.l*6;
      for(const y of [d.a,d.b]) g+=`<line x1="${SX+1}" y1="${-y}" x2="${f(xx+1.2)}" y2="${-y}" stroke="${INK}" stroke-width="${TN}"/>`;
      g+=`<line x1="${f(xx)}" y1="${-d.a}" x2="${f(xx)}" y2="${-d.b}" stroke="${INK}" stroke-width="${TN}"/>`+ah(xx,-d.b,0,-1)+ah(xx,-d.a,0,1)+T(xx-0.9,-(d.a+d.b)/2,d.lab||f(d.b-d.a),'middle',-90);
    }
  }
  ymin=Math.min(ymin,-SY-10-lx*6); xmax=Math.max(xmax,SX+10+ly*6);
  let noteBottom=0;
  for(const n of dw.notes||[]){ const [px,py,txt,ax,ay]=n, right=ax>=px, sx=ax+(right?2:-2);
    g+=`<path d="M${f(px)} ${f(-py)} L${f(ax)} ${f(-ay)} L${f(sx)} ${f(-ay)}" fill="none" stroke="${INK}" stroke-width="${TN}"/>`+ah(px,-py,px-ax,-py+ay);
    g+=T(sx+(right?0.6:-0.6),-ay+1,txt,right?'start':'end');
    const w=txt.length*1.55; if(right) xmax=Math.max(xmax,sx+w+2); else xmin=Math.min(xmin,sx-w-2); ymin=Math.min(ymin,-ay-4); noteBottom=Math.max(noteBottom,-ay+3); }
  // section view
  if(sec){
    const len=sec.axis==='x'?SX:SY, n=sec.axis==='x'?NX:NY, top=Math.max(10,noteBottom+8)+4, Ys=z=>f(top-z);
    const val=k=>sec.axis==='x'?H[Math.min(NY-1,Math.floor(sec.at/CS))*NX+k]:H[k*NX+Math.min(NX-1,Math.floor(sec.at/CS))];
    let d=`M0 ${Ys(-SZ)} L0 ${Ys(val(0))}`; for(let k=0;k<n;k++) d+=` L${f((k+.5)*CS)} ${Ys(val(k))}`; d+=` L${len} ${Ys(val(n-1))} L${len} ${Ys(-SZ)} Z`;
    g+=`<path d="${d}" fill="url(#mhatch)" stroke="${INK}" stroke-width="${TH}" stroke-linejoin="round"/>`;
    g+=`<line x1="0" y1="${Ys(0)}" x2="${len}" y2="${Ys(0)}" stroke="${INK}" stroke-width="${TN}" stroke-dasharray="2 1"/>`;
    g+=T(len/2,Ys(-SZ)+5,'SECTION A–A');
    for(const dd of dw.dims) if(dd.t==='Z'){ const xx=dd.at; g+=`<line x1="${len}" y1="${Ys(dd.a)}" x2="${f(xx+1.2)}" y2="${Ys(dd.a)}" stroke="${INK}" stroke-width="${TN}"/><line x1="${len}" y1="${Ys(dd.b)}" x2="${f(xx+1.2)}" y2="${Ys(dd.b)}" stroke="${INK}" stroke-width="${TN}"/><line x1="${xx}" y1="${Ys(dd.a)}" x2="${xx}" y2="${Ys(dd.b)}" stroke="${INK}" stroke-width="${TN}"/>`+ah(xx,Ys(dd.a),0,-1)+ah(xx,Ys(dd.b),0,1)+T(xx+1.5,(+Ys(dd.a)+ +Ys(dd.b))/2+1,dd.lab,'start'); xmax=Math.max(xmax,xx+16); }
    ymax=top+SZ+8;
  }
  const W=f(xmax-xmin), Hh=f(ymax-ymin);
  return `<svg viewBox="${f(xmin)} ${f(ymin)} ${W} ${Hh}" role="img" aria-label="Drawing for ${l.title}" style="font-family:Barlow,'Segoe UI',sans-serif"><defs><pattern id="mhatch" width="1.8" height="1.8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.8" stroke="${INK}" stroke-width="0.13"/></pattern></defs><rect x="${f(xmin)}" y="${f(ymin)}" width="${W}" height="${Hh}" fill="#fbfaf5"/>${g}</svg>`;
}

  W3(p.x,p.y,p.z,T.toolG.position); T.toolG.rotation.y=T.ang; T.head.position.set(T.toolG.position.x,p.z+tl+10,T.toolG.position.z);
  if(play.sim&&T.trail.geometry.attributes.position) T.trail.geometry.setDrawRange(0,play.idx+1);
  for(let k=0;k<chipN;k++){ const C=T.CH,i=C.next; C.next=(C.next+1)%C.live.length; C.live[i]=1; const a=Math.random()*Math.PI*2, R=p.tool!=null&&S.mag[p.tool]?MTOOLS[S.mag[p.tool]].d/2:3, sp=80+Math.random()*90;
    C.p[i*3]=p.x-SX/2+Math.cos(a)*R; C.p[i*3+1]=Math.max(p.z,-SZ)+1; C.p[i*3+2]=-(p.y-SY/2)+Math.sin(a)*R; C.v[i*3]=Math.cos(a+1.4)*sp; C.v[i*3+1]=40+Math.random()*80; C.v[i*3+2]=Math.sin(a+1.4)*sp;
    for(let m=0;m<3;m++){C.r[i*3+m]=Math.random()*6;C.w[i*3+m]=(Math.random()-.5)*30;} }
  const C=T.CH; let any=false;
  for(let i=0;i<C.live.length;i++){ if(!C.live[i]) continue; any=true;
    if(C.live[i]===1){ C.v[i*3+1]-=700*dt; for(let m=0;m<3;m++){C.p[i*3+m]+=C.v[i*3+m]*dt;C.r[i*3+m]+=C.w[i*3+m]*dt;}
      const onBlock=Math.abs(C.p[i*3])<SX/2&&Math.abs(C.p[i*3+2])<SY/2, floor=onBlock?0.5:-63; if(C.p[i*3+1]<floor){C.p[i*3+1]=floor;C.live[i]=2;} }
    T.e.set(C.r[i*3],C.r[i*3+1],C.r[i*3+2]); T.q.setFromEuler(T.e); T.v3.set(C.p[i*3],C.p[i*3+1],C.p[i*3+2]); T.m4.compose(T.v3,T.q,T.s3); T.chips.setMatrixAt(i,T.m4); }
  if(any||chipN) T.chips.instanceMatrix.needsUpdate=true;
  const coolOn=p.cool&&!T.forceStop; T.coolant.visible=coolOn;
  if(coolOn){ const a=T.coolant.geometry.attributes.position.array, tx=T.toolG.position.x, ty=p.z+4, tz=T.toolG.position.z, sx=tx+60, sy=ty+45, sz=tz+40;
    for(let i=0;i<T.cph.length;i++){ T.cph[i]=(T.cph[i]+dt*2.2)%1; const f=T.cph[i]; a[i*3]=sx+(tx-sx)*f+Math.sin(i*7.1)*1.5*f; a[i*3+1]=sy+(ty-sy)*f-f*f*4; a[i*3+2]=sz+(tz-sz)*f+Math.cos(i*3.3)*1.5*f; }
    T.coolant.geometry.attributes.position.needsUpdate=true; }
  const o=T.orb;
  if(o.follow){ T.focus.x+=(T.toolG.position.x-T.focus.x)*Math.min(1,dt*3); T.focus.y+=(Math.min(p.z,40)-T.focus.y)*Math.min(1,dt*3); T.focus.z+=(T.toolG.position.z-T.focus.z)*Math.min(1,dt*3); }
  else { T.focus.x+=(o.tx-T.focus.x)*Math.min(1,dt*4); T.focus.y+=(o.ty-T.focus.y)*Math.min(1,dt*4); T.focus.z+=(0-T.focus.z)*Math.min(1,dt*4); }
  let sx=0,sy=0; if(T.shake>0){T.shake=Math.max(0,T.shake-dt*1.6);sx=(Math.random()-.5)*8*T.shake;sy=(Math.random()-.5)*8*T.shake;}
  T.camera.position.set(T.focus.x+o.d*Math.sin(o.ph)*Math.sin(o.th)+sx,T.focus.y+o.d*Math.cos(o.ph)+sy,T.focus.z+o.d*Math.sin(o.ph)*Math.cos(o.th));
  T.camera.up.set(0,1,0); if(o.ph<0.05) T.camera.up.set(0,0,-1);
  T.camera.lookAt(T.focus); T.renderer.render(T.scene,T.camera); return T.vis;
}

/* ---------- sound ---------- */
function audioInit(){
  if(AU){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);
    const hum=ctx.createOscillator(); hum.type='sawtooth'; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600; const humG=ctx.createGain(); humG.gain.value=0; hum.connect(lp); lp.connect(humG); humG.connect(master); hum.start();
    const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const nz=ctx.createBufferSource(); nz.buffer=buf; nz.loop=true; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200; bp.Q.value=1.2; const nzG=ctx.createGain(); nzG.gain.value=0; nz.connect(bp); bp.connect(nzG); nzG.connect(master); nz.start();
    const sv=ctx.createOscillator(); sv.type='triangle'; sv.frequency.value=480; const svG=ctx.createGain(); svG.gain.value=0; sv.connect(svG); svG.connect(master); sv.start();
    const cl=ctx.createBufferSource(); cl.buffer=buf; cl.loop=true; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000; const clG=ctx.createGain(); clG.gain.value=0; cl.connect(hp); hp.connect(clG); clG.connect(master); cl.start();
    AU={ctx,hum,humG,bp,nzG,svG,clG,master}; }catch(e){AU=null;}
}
function audioUpdate(v,cut,rapid,cool){ if(!AU) return; const t=AU.ctx.currentTime, on=S.sound;
  AU.hum.frequency.setTargetAtTime(40+v*0.03,t,.25); AU.humG.gain.setTargetAtTime(on&&v>5?.045:0,t,.25);
  AU.nzG.gain.setTargetAtTime(on&&cut?.1:0,t,.05); AU.svG.gain.setTargetAtTime(on&&rapid?.022:0,t,.04); AU.clG.gain.setTargetAtTime(on&&cool?.03:0,t,.2); }
function beep(){ if(!AU||!S.sound) return; const c=AU.ctx,o=c.createOscillator(),g=c.createGain(); o.type='square'; o.frequency.value=880; o.connect(g); g.connect(AU.master); const t=c.currentTime; g.gain.setValueAtTime(.12,t);g.gain.setValueAtTime(0,t+.18);g.gain.setValueAtTime(.12,t+.28);g.gain.setValueAtTime(0,t+.46); o.start(t); o.stop(t+.5); }

/* ---------- main loop ---------- */
let lastNow=0, chipAcc=0;
function loop(now){
  if(document.body.dataset.mode!=='mill'){ audioUpdate(0,false,false,false); lastNow=0; requestAnimationFrame(loop); return; }
  const dt=lastNow?Math.min(.05,(now-lastNow)/1000):0; lastNow=now; let cutting=false,rapid=false;
  if(play.running&&!play.paused){ const pts=play.sim.pts,last=pts.length-1,mult=SPEEDS[speedIx][1],i0=play.idx;
    if(mult===Infinity){ while(play.idx<last){play.idx++;applyPt(pts[play.idx]);} play.t=play.sim.total; }
    else { play.t+=dt*mult; while(play.idx<last&&pts[play.idx+1].t<=play.t){ play.idx++; const p=pts[play.idx]; applyPt(p); if(p.cut){cutting=true;chipAcc+=p.cut*.12;} } }
    const moved=play.idx>i0; rapid=moved&&pts[play.idx].rapid; updateDRO(); if(moved&&tab==='2d') draw2D();
    if(play.idx>=last){ play.t=play.sim.total; updateDRO(); finish(); } }
  chipAcc=Math.min(chipAcc,8); let chipN=0; if(SPEEDS[speedIx][1]!==Infinity){chipN=Math.min(4,Math.floor(chipAcc));chipAcc-=chipN;} else chipAcc=0;
  let v=0; if(tab==='3d'&&T3) v=render3D(dt,chipN); else if(tab==='2d'&&play.changed.length>4000) play.changed.length=0;
  const p=curPt(), stop=T3&&T3.forceStop; audioUpdate(v||(p.spin&&!stop?p.rpm:0),cutting,rapid,p.cool&&p.spin&&!stop);
  requestAnimationFrame(loop);
}

let refTab='g', refQuery='';
function renderRef(){
  const b=$('mrefbody'); [...$('mreftabs').children].forEach(x=>x.setAttribute('aria-selected',x.dataset.t===refTab));
  if(refTab==='c'){ b.innerHTML=MCALCS.map((c,i)=>`<div class="calc" data-i="${i}"><h4>${c.title}</h4><div class="in">${c.inputs.map(([k,lab,v])=>`<label>${lab}<input type="number" inputmode="decimal" step="any" data-k="${k}" value="${v}"></label>`).join('')}</div><div class="out"></div>${c.insert?'<button class="btn small ins">Insert into program</button>':''}</div>`).join('')+`<p class="refnote">Starting points only. Check the tool maker's data for your cutter and material.</p>`; [...b.querySelectorAll('.calc')].forEach(updCalc); return; }
  const rows=(refTab==='g'?MG:MM).filter(r=>!refQuery||(r[0]+' '+r[1]+' '+(r[2]||'')).toLowerCase().includes(refQuery.toLowerCase()));
  b.innerHTML=`<input class="codesearch" type="search" placeholder="Search, e.g. tap or offset" value="${esc(refQuery)}" aria-label="Search codes"><table class="ctable"><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}${(refTab==='g'?r[3]:r[2])?'<span class="tag">not simulated</span>':''}${refTab==='g'&&r[2]?`<br><code>${esc(r[2])}</code>`:''}</td></tr>`).join('')||'<tr><td></td><td>Nothing matches.</td></tr>'}</tbody></table>${refTab==='m'?'<p class="refnote">Pallet, door, probe and chip conveyor M codes are set by the machine builder. Check the machine manual.</p>':''}`;
  const q=b.querySelector('.codesearch'); q.oninput=()=>{refQuery=q.value;const pos=q.selectionStart;renderRef();const n=$('mrefbody').querySelector('.codesearch');n.focus();n.setSelectionRange(pos,pos);};
}
function updCalc(el){ const c=MCALCS[+el.dataset.i], v={}; el.querySelectorAll('input').forEach(i=>v[i.dataset.k]=parseFloat(i.value)); const r=c.calc(v); el.querySelector('.out').innerHTML=r.out.map(([k,x])=>`<div>${k}<b>${x}</b></div>`).join(''); el._ins=r.ins; }
